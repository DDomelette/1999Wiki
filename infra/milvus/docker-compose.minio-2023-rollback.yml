services:
  minio:
    container_name: milvus-main-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"

  standalone:
    container_name: milvus-main-standalone
    image: milvusdb/milvus:v2.5.27
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "127.0.0.1:19091:9091"
    depends_on:
      - minio

  attu:
    container_name: attu-main
    image: zilliz/attu:v2.6.5
    environment:
      MILVUS_URL: "milvus-main-standalone:19530"
    ports:
      - "30001:3000"
    depends_on:
      - standalone

networks:
  default:
    name: milvus-main-network
    external: true
