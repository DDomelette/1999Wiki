# Instantiate this file with a distinct Compose project name for each slot.
# The project-scoped default network keeps blue and green service DNS isolated.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to a protected runtime env file}
    volumes:
      - /srv/1999wiki/rag-artifacts:/runtime/rag/huiji:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import os
          import urllib.request

          required = (
              'MINIO_ACCESS_KEY',
              'MINIO_SECRET_KEY',
              'MYSQL_USER',
              'MYSQL_PASSWORD',
              'DEEPSEEK_API_KEY',
              'SILICONFLOW_API_KEY',
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('missing required runtime credentials: ' + ','.join(missing))

          data = json.load(
              urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
          )
          if not (
              data.get('status') == 'ok'
              and data.get('vectorstore_loaded') is True
              and data.get('provenance_status') == 'pass'
              and data.get('llm_ready') is True
          ):
              raise SystemExit(
                  'backend readiness failed: '
                  'status,vectorstore_loaded,provenance_status,llm_ready'
              )
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - infra

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          static="$$(wget -q -T 3 -O - http://127.0.0.1:8080/)" &&
          printf '%s' "$$static" | grep -Fq '<div id="root"></div>' &&
          readiness="$$(wget -q -T 3 -O - http://127.0.0.1:8080/health)" &&
          printf '%s' "$$readiness" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' &&
          printf '%s' "$$readiness" | grep -Eq '"vectorstore_loaded"[[:space:]]*:[[:space:]]*true' &&
          printf '%s' "$$readiness" | grep -Eq '"provenance_status"[[:space:]]*:[[:space:]]*"pass"' &&
          printf '%s' "$$readiness" | grep -Eq '"llm_ready"[[:space:]]*:[[:space:]]*true'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

networks:
  default: {}
  infra:
    external: true
    name: 1999wiki-infra
