# Instantiate this file with a distinct Compose project name for each slot.
# The project-scoped default network keeps blue and green service DNS isolated.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to a protected runtime env file}
    volumes:
      - /srv/1999wiki/rag-artifacts:/runtime/rag/huiji:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import urllib.request

          data = json.load(
              urllib.request.urlopen(
                  'http://127.0.0.1:8000/health/ready',
                  timeout=30,
              )
          )
          if not (
              data.get('status') == 'ready'
              and data.get('failing_subsystems') == []
          ):
              raise SystemExit(
                  'backend readiness failed'
              )
      interval: 30s
      timeout: 35s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - infra

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          static="$$(wget -q -T 5 -O - http://127.0.0.1:8080/)" &&
          printf '%s' "$$static" | grep -Fq '<div id="root"></div>' &&
          readiness="$$(wget -q -T 30 -O - http://127.0.0.1:8080/health/ready)" &&
          printf '%s' "$$readiness" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"' &&
          printf '%s' "$$readiness" | grep -Eq '"failing_subsystems"[[:space:]]*:[[:space:]]*\[\]'
      interval: 30s
      timeout: 35s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

networks:
  default: {}
  infra:
    external: true
    name: 1999wiki-infra
