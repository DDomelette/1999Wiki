<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1999Search · 知识库问答</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">✦ 1999Search</div>
    <div class="subtitle">Reverse: 1999 知识库 RAG 助手</div>
  </header>
  <main class="layout">
    <aside class="sidebar">
      <label class="field-label">分类筛选</label>
      <select id="category" class="select">
        <option value="">全部</option>
        <option value="人物">人物</option>
        <option value="心相">心相</option>
        <option value="剧情">剧情</option>
        <option value="世界">世界</option>
        <option value="阵营">阵营</option>
        <option value="日历">日历</option>
      </select>
      <div class="status" id="status">连接中…</div>
      <div class="hint">提示: 回车发送。引用来源可点击展开。</div>
    </aside>
    <section class="chat">
      <div id="messages" class="messages"></div>
      <form id="form" class="composer">
        <input id="question" class="input" placeholder="问问关于角色、心相、剧情的问题…" autocomplete="off" />
        <button class="send" type="submit">发送</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
