name: Temporary PR verification

on:
  push:
    branches:
      - fix/assistant-meta-smalltalk-routing

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked development dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete Python test suite
        run: python -m pytest -q
