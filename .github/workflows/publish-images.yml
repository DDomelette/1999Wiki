name: Inspect registry access without publication
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  registry-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: sudo apt-get update && sudo apt-get install --yes skopeo
      - name: Inspect registry login and tag access
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path('.github/scripts').resolve()))
          from registry_transport import _fatal_code, _is_explicit_absence, classify_failure
          auth = pathlib.Path(os.environ['RUNNER_TEMP']) / 'diagnostic-auth.json'
          auth.write_text('{"auths":{}}\n')
          auth.chmod(0o600)
          def record(registry, operation, result):
              print(json.dumps({'registry': registry, 'operation': operation, 'returncode': result.returncode, 'classification': classify_failure(result.stderr).value if result.returncode else 'success', 'code': _fatal_code(result.stderr) if result.returncode else None, 'explicit_absence': _is_explicit_absence(result.stderr) if result.returncode else False}), flush=True)
          try:
              for label, host, prefix, existing in [('tcr', 'ccr.ccs.tencentyun.com', 'ccr.ccs.tencentyun.com/1999wiki_code', 'sha-345fa54'), ('ghcr', 'ghcr.io', 'ghcr.io/ddomelette', 'sha-1ec7752')]:
                  result = subprocess.run(['skopeo', 'login', '--authfile', str(auth), '--username', os.environ[label.upper() + '_USERNAME'], '--password-stdin', host], input=os.environ[label.upper() + '_PASSWORD'], text=True, capture_output=True, timeout=60)
                  record(label, 'login', result)
                  if result.returncode:
                      continue
                  for component in ('backend', 'frontend'):
                      for tag in (existing, 'sha-d214556'):
                          result = subprocess.run(['skopeo', 'inspect', '--raw', '--authfile', str(auth), f'docker://{prefix}/1999wiki-{component}:{tag}'], text=True, capture_output=True, timeout=60)
                          record(label, f'probe:{component}:{tag}', result)
          finally:
              auth.unlink(missing_ok=True)
          PY
