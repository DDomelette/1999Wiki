name: Publish immutable application images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.sha }}
      - name: Pull LFS objects
        run: git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements/dev.lock.txt
      - name: Run Python tests
        run: python -m pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.sha }}
      - name: Pull LFS objects
        run: git lfs pull
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend/react-app
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend/react-app
        run: npm test
      - name: Build frontend
        working-directory: frontend/react-app
        run: npm run build

  publish:
    needs: [python-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.sha }}
      - name: Pull LFS objects
        run: git lfs pull
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
      - id: immutability
        name: Refuse existing release tags
        shell: bash
        run: |
          bash .github/scripts/refuse-existing-image-tags.sh \
            "ghcr.io/ddomelette/1999wiki-backend:${{ steps.tag.outputs.tag }}" \
            "ghcr.io/ddomelette/1999wiki-frontend:${{ steps.tag.outputs.tag }}"
      - id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ghcr.io/ddomelette/1999wiki-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ghcr.io/ddomelette/1999wiki-frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: manifest
        name: Create release identity manifest
        shell: bash
        run: |
          python3 deploy/bin/release_manifest.py create \
            --commit "$GITHUB_SHA" \
            --backend-tag "ghcr.io/ddomelette/1999wiki-backend:${{ steps.tag.outputs.tag }}" \
            --backend-digest "${{ steps.backend.outputs.digest }}" \
            --frontend-tag "ghcr.io/ddomelette/1999wiki-frontend:${{ steps.tag.outputs.tag }}" \
            --frontend-digest "${{ steps.frontend.outputs.digest }}" \
            --output release-manifest.json
      - name: Upload release identity manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.tag.outputs.tag }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
      - id: summary
        name: Write published image digests
        shell: bash
        run: |
          {
            echo "## Published images"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Backend: ghcr.io/ddomelette/1999wiki-backend:${{ steps.tag.outputs.tag }}@${{ steps.backend.outputs.digest }}"
            echo "- Frontend: ghcr.io/ddomelette/1999wiki-frontend:${{ steps.tag.outputs.tag }}@${{ steps.frontend.outputs.digest }}"
            echo "- Artifact: release-${{ steps.tag.outputs.tag }}/release-manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"
